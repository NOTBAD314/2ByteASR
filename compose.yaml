name: twobyteasr-081
services:
  twobyteasr:
    image: 2byteasr:0.8.1-docker.1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: "${VCS_REF:-docker-local}"
    platform: linux/amd64
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: Asia/Shanghai
      CUSTOM_USER: "${WEB_USER:-2byteasr}"
      PASSWORD: "${WEB_PASSWORD:-}"
    volumes:
      - config:/config
      - models:/models
      - "${MEDIA_DIR:-./media}:/media"
    shm_size: "1gb"
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  config:
  models:
