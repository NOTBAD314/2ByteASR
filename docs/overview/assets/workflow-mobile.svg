<svg xmlns="http://www.w3.org/2000/svg" width="560" height="800" viewBox="0 0 560 800" role="img" aria-labelledby="title desc"><title id="title">从素材到成片</title><desc id="desc">导入素材、主力转写、字级时间轴、按需断句与复核、Studio精修、特效与剪辑、导出字幕或成片。术语库辅助识别与纠错，流程按方案组合。</desc><rect width="560" height="800" rx="18" fill="#1c1623"/><text x="28" y="42" fill="#f0b4d5" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="600">从素材到成片</text><rect x="28" y="65" width="504" height="78" rx="11" fill="#292030"/><text x="44" y="95" fill="#d892bc" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="600">01</text><text x="93" y="95" fill="#fff6fb" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="600">导入素材</text><text x="93" y="124" fill="#c4b6cc" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400">视频 / 音频</text><path d="M 280 144 v 13 m -4 -4 l 4 4 4 -4" stroke="#986c91" fill="none" stroke-width="2"/><rect x="28" y="158" width="504" height="78" rx="11" fill="#292030"/><text x="44" y="188" fill="#d892bc" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="600">02</text><text x="93" y="188" fill="#fff6fb" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="600">主力转写</text><text x="93" y="217" fill="#c4b6cc" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400">先得到文字</text><path d="M 280 237 v 13 m -4 -4 l 4 4 4 -4" stroke="#986c91" fill="none" stroke-width="2"/><rect x="28" y="251" width="504" height="78" rx="11" fill="#292030"/><text x="44" y="281" fill="#d892bc" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="600">03</text><text x="93" y="281" fill="#fff6fb" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="600">字级时间轴</text><text x="93" y="310" fill="#c4b6cc" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400">把字与声音对上</text><path d="M 280 330 v 13 m -4 -4 l 4 4 4 -4" stroke="#986c91" fill="none" stroke-width="2"/><rect x="28" y="344" width="504" height="78" rx="11" fill="#292030"/><text x="44" y="374" fill="#d892bc" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="600">04</text><text x="93" y="374" fill="#fff6fb" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="600">断句 / 复核</text><text x="93" y="403" fill="#c4b6cc" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400">按需减少修正</text><path d="M 280 423 v 13 m -4 -4 l 4 4 4 -4" stroke="#986c91" fill="none" stroke-width="2"/><rect x="28" y="437" width="504" height="78" rx="11" fill="#402538"/><text x="44" y="467" fill="#d892bc" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="600">05</text><text x="93" y="467" fill="#fff6fb" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="600">Studio 精修</text><text x="93" y="496" fill="#c4b6cc" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400">看画面，改字幕</text><path d="M 280 516 v 13 m -4 -4 l 4 4 4 -4" stroke="#986c91" fill="none" stroke-width="2"/><rect x="28" y="530" width="504" height="78" rx="11" fill="#292030"/><text x="44" y="560" fill="#d892bc" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="600">06</text><text x="93" y="560" fill="#fff6fb" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="600">特效 / 剪辑</text><text x="93" y="589" fill="#c4b6cc" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400">套样式或 AI 设计</text><path d="M 280 609 v 13 m -4 -4 l 4 4 4 -4" stroke="#986c91" fill="none" stroke-width="2"/><rect x="28" y="623" width="504" height="78" rx="11" fill="#292030"/><text x="44" y="653" fill="#d892bc" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="600">07</text><text x="93" y="653" fill="#fff6fb" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="600">字幕 / 成片</text><text x="93" y="682" fill="#c4b6cc" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400">导出或直接压制</text><text x="28" y="748" fill="#edbad5" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="600">术语库辅助识别与纠错</text><text x="28" y="780" fill="#c4b6cc" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400">辅助步骤按需选择，不必跑完所有模型。</text></svg>