<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="262" viewBox="0 0 1440 262" role="img" aria-labelledby="title desc"><title id="title">从素材到成片</title><desc id="desc">导入素材、主力转写、字级时间轴、按需断句与复核、Studio精修、特效与剪辑、导出字幕或成片。术语库辅助识别与纠错，流程按方案组合。</desc><rect width="1440" height="262" rx="18" fill="#1c1623"/><text x="28" y="42" fill="#f0b4d5" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="600">从素材到成片</text><rect x="28" y="72" width="185" height="105" rx="11" fill="#292030"/><text x="44" y="102" fill="#d892bc" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="600">01</text><text x="44" y="132" fill="#fff6fb" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="600">导入素材</text><text x="44" y="160" fill="#c4b6cc" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400">视频 / 音频</text><path d="M 216 122 h 9 m -4 -4 l 4 4 -4 4" stroke="#986c91" fill="none" stroke-width="2"/><rect x="227" y="72" width="185" height="105" rx="11" fill="#292030"/><text x="243" y="102" fill="#d892bc" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="600">02</text><text x="243" y="132" fill="#fff6fb" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="600">主力转写</text><text x="243" y="160" fill="#c4b6cc" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400">先得到文字</text><path d="M 415 122 h 9 m -4 -4 l 4 4 -4 4" stroke="#986c91" fill="none" stroke-width="2"/><rect x="426" y="72" width="185" height="105" rx="11" fill="#292030"/><text x="442" y="102" fill="#d892bc" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="600">03</text><text x="442" y="132" fill="#fff6fb" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="600">字级时间轴</text><text x="442" y="160" fill="#c4b6cc" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400">把字与声音对上</text><path d="M 614 122 h 9 m -4 -4 l 4 4 -4 4" stroke="#986c91" fill="none" stroke-width="2"/><rect x="625" y="72" width="185" height="105" rx="11" fill="#292030"/><text x="641" y="102" fill="#d892bc" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="600">04</text><text x="641" y="132" fill="#fff6fb" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="600">断句 / 复核</text><text x="641" y="160" fill="#c4b6cc" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400">按需减少修正</text><path d="M 813 122 h 9 m -4 -4 l 4 4 -4 4" stroke="#986c91" fill="none" stroke-width="2"/><rect x="824" y="72" width="185" height="105" rx="11" fill="#402538"/><text x="840" y="102" fill="#d892bc" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="600">05</text><text x="840" y="132" fill="#fff6fb" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="600">Studio 精修</text><text x="840" y="160" fill="#c4b6cc" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400">看画面，改字幕</text><path d="M 1012 122 h 9 m -4 -4 l 4 4 -4 4" stroke="#986c91" fill="none" stroke-width="2"/><rect x="1023" y="72" width="185" height="105" rx="11" fill="#292030"/><text x="1039" y="102" fill="#d892bc" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="600">06</text><text x="1039" y="132" fill="#fff6fb" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="600">特效 / 剪辑</text><text x="1039" y="160" fill="#c4b6cc" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400">套样式或 AI 设计</text><path d="M 1211 122 h 9 m -4 -4 l 4 4 -4 4" stroke="#986c91" fill="none" stroke-width="2"/><rect x="1222" y="72" width="185" height="105" rx="11" fill="#292030"/><text x="1238" y="102" fill="#d892bc" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="600">07</text><text x="1238" y="132" fill="#fff6fb" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="600">字幕 / 成片</text><text x="1238" y="160" fill="#c4b6cc" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400">导出或直接压制</text><path d="M 232 197 H 812" stroke="#87516e" stroke-dasharray="4 5" fill="none"/><text x="28" y="231" fill="#edbad5" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="600">术语库：专名、别名与纠错关系</text><text x="797" y="231" fill="#c4b6cc" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400">辅助步骤按需选择，不必跑完所有模型。</text></svg>