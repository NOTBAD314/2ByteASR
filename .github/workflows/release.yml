name: bounded-0.9.6-draft-transfer
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
permissions: {}
jobs:
  transfer-verified-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_TAG: ${{ inputs.tag }}
      ASSET_SPEC_B64: ''
      SMALL_FILES_B64: ''
    steps:
      - name: Transfer only fixed verified files into the existing draft
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,concurrent.futures,hashlib,json,os,pathlib,subprocess,tempfile,time,urllib.parse
          REPO='NOTBAD314/2ByteASR';TAG='v0.9.6';RID=437607092;TARGET='8fcdba51f09b3f43629370d91c00d5e59f6d84c6'
          assert os.environ['GITHUB_REPOSITORY'].casefold()==REPO.casefold() and os.environ['INPUT_TAG']==TAG
          spec=json.loads(base64.b64decode(os.environ['ASSET_SPEC_B64']));expected={x['name']:x for x in spec}
          def gh(*args):return subprocess.check_output(['gh',*args],text=True)
          def release():
           r=json.loads(gh('api',f'repos/{REPO}/releases/{RID}'))
           assert r['draft'] and r['tag_name']==TAG and r['target_commitish']==TARGET
           return r
          remote={x['name']:x for x in release()['assets']};assert not(set(remote)-set(expected))
          for name,r in remote.items():
           x=expected[name];assert r['state']=='uploaded' and r['size']==x['size'] and r['digest']=='sha256:'+x['sha256'],name
          small=json.loads(base64.b64decode(os.environ['SMALL_FILES_B64']))
          folder=pathlib.Path(tempfile.mkdtemp(prefix='verified-gitcode-095-'))
          def copy(x):
           name=x['name']
           if name in remote:return dict(name=name,reused=True)
           p=folder/name;url='https://gitcode.com/Notbad314/2ByteASR/releases/download/'+TAG+'/'+urllib.parse.quote(name)
           start=time.monotonic();print('DOWNLOAD',name,flush=True)
           if name in small:p.write_bytes(base64.b64decode(small[name]))
           else:
            subprocess.run(['curl','--fail','--location','--silent','--show-error','--retry','3','--connect-timeout','20','--max-time','900','--output',str(p),url],check=True)
           h=hashlib.sha256()
           with p.open('rb')as f:
            for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
           assert p.stat().st_size==x['size'] and h.hexdigest()==x['sha256'],name
           downloaded=round(time.monotonic()-start,2);print('VERIFIED',name,downloaded,flush=True)
           subprocess.run(['gh','release','upload',TAG,str(p),'--repo',REPO],check=True)
           result=dict(name=name,download_seconds=downloaded,total_seconds=round(time.monotonic()-start,2));print(json.dumps(result),flush=True);return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=3)as pool:results=list(pool.map(copy,spec))
          for attempt in range(10):
           final={x['name']:x for x in release()['assets']}
           if len(final)==len(expected) and all(name in final and final[name]['state']=='uploaded' and final[name]['size']==x['size'] and final[name].get('digest')=='sha256:'+x['sha256']for name,x in expected.items()):break
           time.sleep(2)
          else:raise RuntimeError('Final GitHub digest verification failed')
          print(json.dumps(dict(passed=True,draft=True,assets=len(expected),results=results)),flush=True)
          PY
