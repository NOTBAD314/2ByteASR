name: bounded-1.0.2-public-verification
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
permissions: {}
jobs:
  anonymous-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      INPUT_TAG: ${{ inputs.tag }}
      SPEC_B64: ''
    steps:
      - name: Hash all public release bytes without credentials
        shell: bash
        run: |
          python3 - <<'PY'
          """Stream every public asset and referenced component without credentials."""
          import base64
          from concurrent.futures import ThreadPoolExecutor
          import hashlib
          import json
          import os
          from pathlib import Path
          import time
          import urllib.parse
          import urllib.request

          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          spec=json.loads(base64.b64decode(os.environ['SPEC_B64']))
          tag='v1.0.2'
          assert os.environ['INPUT_TAG']==tag
          bases=dict(github='https://github.com/NOTBAD314/2ByteASR/releases/download/',
              gitcode='https://gitcode.com/Notbad314/2ByteASR/releases/download/')
          latest_urls=dict(github='https://api.github.com/repos/NOTBAD314/2ByteASR/releases/latest',
              gitcode='https://api.gitcode.com/api/v5/repos/Notbad314/2ByteASR/releases/latest')

          def request(url):
              return urllib.request.Request(url,headers={'User-Agent':'2ByteASR-anonymous-release-audit/1.0.2'})

          latest={}
          for host,url in latest_urls.items():
              with opener.open(request(url),timeout=90) as response:
                  latest[host]=json.load(response)['tag_name']
          assert all(value==tag for value in latest.values()),latest

          def check(task):
              host,item=task
              url=bases[host]+item['tag']+'/'+urllib.parse.quote(item['name'])
              started=time.monotonic()
              for attempt in range(3):
                  try:
                      digest=hashlib.sha256()
                      count=0
                      with opener.open(request(url),timeout=120) as response:
                          status=response.status
                          for block in iter(lambda:response.read(4*1024*1024),b''):
                              digest.update(block)
                              count+=len(block)
                      result=dict(host=host,**item,url=url,status=status,length=count,actual_sha256=digest.hexdigest(),
                          ok=count==item['size'] and digest.hexdigest()==item['sha256'],
                          seconds=round(time.monotonic()-started,2))
                      print(json.dumps(result),flush=True)
                      return result
                  except Exception as error:
                      if attempt==2:
                          result=dict(host=host,**item,url=url,ok=False,error=str(error)[:300])
                          print(json.dumps(result),flush=True)
                          return result
                      time.sleep(3)

          tasks=[(host,item) for host in bases for item in spec]
          with ThreadPoolExecutor(max_workers=4) as pool:
              results=list(pool.map(check,tasks))
          report=dict(passed=all(item['ok'] for item in results),version='1.0.2',anonymous=True,
              full_sha256=True,latest=latest,assets=results)
          Path('anonymous-release-verification.json').write_text(json.dumps(report,indent=2),'utf8')
          assert report['passed']
          print('ALL_PUBLIC_BYTES_VERIFIED',len(results),flush=True)

          PY
      - name: Retain bounded verification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: anonymous-release-verification-1.0.2
          path: anonymous-release-verification.json
          retention-days: 1
