name: native-source-workshop-diagnosis-only
on:
  workflow_dispatch:
    inputs:
      checker_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  source-ui:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checker_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10.11'
          architecture: arm64
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: macos-arm64-setup-c4351735617b5a60d06d2e00de9494dee0b30ae5
          run-id: 43286795130
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tmp/input
      - name: Prepare only GUI dependencies and fixed native tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tmp/mount"
          dmg=$(find "$RUNNER_TEMP/tmp/input" -name '*.dmg' -type f)
          echo '8b1b84582df358576a773a37f43493b8be4be758db253191aa034162b51e9deb  '"$dmg" | shasum -a 256 -c -
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$RUNNER_TEMP/tmp/mount" "$dmg"
          test ! -e /Applications/2ByteASR.app
          ditto "$RUNNER_TEMP/tmp/mount/2ByteASR.app" /Applications/2ByteASR.app
          python -m venv "$RUNNER_TEMP/tmp/gui"
          "$RUNNER_TEMP/tmp/gui/bin/python" -m pip install -r packaging/macos/requirements-gui.txt
          git worktree add --detach "$RUNNER_TEMP/tmp/baseline" c4351735617b5a60d06d2e00de9494dee0b30ae5
      - name: Native source negative and positive probes with actual display ownership
        shell: bash
        run: |
          set -euo pipefail
          tools=/Applications/2ByteASR.app/Contents/Resources/tools
          test -d "$tools" || tools=/Applications/2ByteASR.app/Contents/Frameworks/tools
          python scripts/macos_display_mode_probe.py "$RUNNER_TEMP/tmp/display-negative" "$RUNNER_TEMP/tmp/gui/bin/python" .github/scripts/macos_workshop_source_probe.py --source "$RUNNER_TEMP/tmp/baseline" --out "$RUNNER_TEMP/tmp/probe-old" --tools "$tools"
          python scripts/macos_display_mode_probe.py "$RUNNER_TEMP/tmp/display-positive" "$RUNNER_TEMP/tmp/gui/bin/python" .github/scripts/macos_workshop_source_probe.py --source "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/tmp/probe-new" --tools "$tools"
          python - <<'PY'
          import json,os
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])/'tmp'
          old=json.loads((base/'probe-old/source-probe-summary.json').read_text('utf8'))
          new=json.loads((base/'probe-new/source-probe-summary.json').read_text('utf8'))
          result=dict(source_only=True,negative_reproduced=not old['passed'] and old['failed_count']>0,positive_passed=new['passed'],old=old,new=new)
          (base/'source-comparison.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),'utf8')
          print(json.dumps(result,ensure_ascii=False))
          assert result['positive_passed']
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-source-workshop-probe
          retention-days: 1
          path: |
            ${{ runner.temp }}/tmp/probe-old/*.json
            ${{ runner.temp }}/tmp/probe-old/*.log
            ${{ runner.temp }}/tmp/probe-old/*.png
            ${{ runner.temp }}/tmp/probe-new/*.json
            ${{ runner.temp }}/tmp/probe-new/*.log
            ${{ runner.temp }}/tmp/probe-new/*.png
            ${{ runner.temp }}/tmp/source-comparison.json
