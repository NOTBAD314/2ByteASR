name: 1.1.0 remaining native checks
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  same-dmg-remaining:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      SOURCE_SHA: bfe1a48f05c7a5035007265bb2beb77e222aed22
      PRODUCER_RUN: 43741874563
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bfe1a48f05c7a5035007265bb2beb77e222aed22
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10.11'
          architecture: arm64
      - name: Establish disposable QA boundary
        run: |
          set -euo pipefail
          qa="$RUNNER_TEMP/tmp/p110"
          mkdir -p "$qa"
          echo "QA=$qa" >> "$GITHUB_ENV"
          echo "TWOBYTEASR_TEST_ROOT=$qa" >> "$GITHUB_ENV"
      - name: Prepare the external checking interpreter
        run: python scripts/macos_prepare_runtime.py --runtime "$QA/runtime" --receipt "$QA/runtime.json"
      - name: Observe native IPC path boundary
        run: |
          "$QA/runtime/bin/python" scripts/macos_socket_path_probe.py "$QA/ipc-proof"
          mkdir -p "$QA/build"
          cp "$QA/ipc-proof/socket-path-boundary.json" "$QA/build/socket-path-boundary.json"
      - name: Install the unchanged first DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$PRODUCER_RUN" --repo NOTBAD314/2ByteASR --name "macos-arm64-setup-$SOURCE_SHA" --dir "$QA/candidate"
          dmg=$(find "$QA/candidate" -name '2ByteASR-1.1.0-macos-arm64-Setup.dmg')
          test "$(stat -f %z "$dmg")" = 591181871
          test "$(shasum -a 256 "$dmg" | cut -d ' ' -f 1)" = 8f709602f47be0e518ba6f1c792a8ae409b57cde8de004b2c4d9b082d499aabd
          mkdir "$QA/mount"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$QA/mount" "$dmg"
          test ! -e /Applications/2ByteASR.app
          ditto "$QA/mount/2ByteASR.app" /Applications/2ByteASR.app
          hdiutil detach "$QA/mount"
          codesign --verify --deep --strict /Applications/2ByteASR.app
      - name: Set an isolated user reduced-motion preference
        run: |
          cat > "$QA/reduced-check.py" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          from scripts import macos_caption_policy_smoke as check
          original=check.blank_environment
          def environment(output,invoker,target):
              from twobyteasr.app.application_settings import save_hub_preferences
              save_hub_preferences('',True,30,20,True,True,reduce_motion=True)
              return original(output,invoker,target)
          check.blank_environment=environment
          raise SystemExit(check.main())
          PY
      - name: Run every remaining scene independently
        id: scenes
        continue-on-error: true
        run: |
          set -uo pipefail
          code=0
          for scenario in english-track-loudness; do
            python scripts/macos_display_mode_probe.py "$QA/display-110-$scenario" "$QA/runtime/bin/python" "$QA/reduced-check.py" --app /Applications/2ByteASR.app --scenario "$scenario" --output "$QA/$scenario" || code=1
          done
          exit "$code"
      - name: Bound the evidence
        if: always()
        run: python scripts/macos_collect_artifacts.py --qa-root "$QA" --maximum-bytes 104857600
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mac110-audio-reduced-r2
          retention-days: 1
          path: ${{ env.QA }}/artifacts/receipts/
      - name: Enforce all four checks
        if: always()
        run: test '${{ steps.scenes.outcome }}' = success
