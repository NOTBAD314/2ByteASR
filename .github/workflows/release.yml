name: 1.0.1-static-Mac-workflow-contract-correction
on:
  workflow_dispatch:
    inputs:
      checker_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  static-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      APP_SOURCE_SHA: 'ba6ad489c2f4d3030c37ce8ce14a6d37a361e218'
      CHECKER_SHA: ${{ inputs.checker_sha }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checker_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10.11'
      - name: Check only the actual static workflow contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHECKER_SHA"
          python -m venv "$RUNNER_TEMP/contract-runtime"
          "$RUNNER_TEMP/contract-runtime/bin/python" -m pip install --disable-pip-version-check pytest==9.1.1 PyYAML==6.0.3
          "$RUNNER_TEMP/contract-runtime/bin/python" -m pytest --noconftest -q tests/test_macos_build_contract.py::test_manual_workflow_is_bounded_read_only_and_pinned_to_trusted_source --junitxml static-contract.xml
      - name: Bind correction to the unchanged application workflow
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,platform,subprocess,xml.etree.ElementTree as ET
          from pathlib import Path
          app=os.environ['APP_SOURCE_SHA'];checker=os.environ['CHECKER_SHA']
          changes=subprocess.check_output(['git','diff','--name-only',app,checker],text=True).splitlines()
          assert set(changes)=={'tests/test_macos_build_contract.py','.github/workflows/release.yml'},changes
          original=subprocess.check_output(['git','show',app+':.github/workflows/macos-experimental.yml'])
          actual=Path('.github/workflows/macos-experimental.yml').read_bytes()
          assert original==actual
          suites=ET.parse('static-contract.xml').getroot()
          totals={k:sum(int(s.get(k,'0')) for s in suites) for k in ('tests','failures','errors','skipped')}
          assert totals==dict(tests=1,failures=0,errors=0,skipped=0),totals
          result=dict(passed=True,configuration_only=True,application_binary_changed=False,app_source_sha=app,checker_sha=checker,changed_paths=changes,workflow_sha256=hashlib.sha256(actual).hexdigest(),test_sha256=hashlib.sha256(Path('tests/test_macos_build_contract.py').read_bytes()).hexdigest(),host=dict(system=platform.system(),machine=platform.machine()),checks=totals,case='test_manual_workflow_is_bounded_read_only_and_pinned_to_trusted_source')
          Path('static-contract-correction.json').write_text(json.dumps(result,indent=2),'utf8')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: static-contract-correction-1.0.1
          retention-days: 1
          path: |
            static-contract.xml
            static-contract-correction.json
