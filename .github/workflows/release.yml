name: full-GitCode-pre-publication-audit
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
permissions: {}
jobs:
  anonymous-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      INPUT_TAG: ${{ inputs.tag }}
      SPEC_B64: ''
    steps:
      - name: Hash every pre-upload and referenced component without credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,time,urllib.parse,urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          assert os.environ['INPUT_TAG']=='v1.0.0'
          spec=json.loads(base64.b64decode(os.environ['SPEC_B64']))
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          latest_url='https://api.gitcode.com/api/v5/repos/Notbad314/2ByteASR/releases/latest'
          def request(url):return urllib.request.Request(url,headers={'User-Agent':'2ByteASR-anonymous-pre-audit/1.0.0'})
          def latest():
              with opener.open(request(latest_url),timeout=90) as response:return json.load(response)['tag_name']
          before=latest()
          assert before=='v0.9.8',before
          def check(row):
              url='https://gitcode.com/Notbad314/2ByteASR/releases/download/'+row['tag']+'/'+urllib.parse.quote(row['name'])
              start=time.monotonic()
              for attempt in range(3):
                  try:
                      digest=hashlib.sha256();size=0
                      with opener.open(request(url),timeout=120) as response:
                          status=response.status
                          for block in iter(lambda:response.read(4*1024*1024),b''):
                              size+=len(block);digest.update(block)
                      result=dict(**row,status=status,length=size,actual_sha256=digest.hexdigest(),url=url,
                          ok=status==200 and size==row['size'] and digest.hexdigest()==row['sha256'],
                          seconds=round(time.monotonic()-start,2))
                      print(json.dumps(result),flush=True);return result
                  except Exception as error:
                      if attempt==2:return dict(**row,ok=False,error=str(error)[:300])
                      time.sleep(3)
          with ThreadPoolExecutor(max_workers=4) as pool:results=list(pool.map(check,spec))
          after=latest()
          result=dict(passed=before==after=='v0.9.8' and all(row['ok'] for row in results),
              anonymous=True,full_sha256=True,before_publish=True,latest_before=before,latest_after=after,assets=results)
          Path('gitcode-pre-anonymous.json').write_text(json.dumps(result,indent=2),'utf8')
          assert result['passed']
          print('ALL_GITCODE_PRE_BYTES_VERIFIED',len(results),flush=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gitcode-pre-anonymous-1.0.0
          retention-days: 1
          path: gitcode-pre-anonymous.json
