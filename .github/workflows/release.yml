name: bounded-macos093-asset-append
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
permissions: {}
jobs:
  append-verified-mac-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_TAG: ${{ inputs.tag }}
      ASSET_SPEC_B64: ''
    steps:
      - name: Append fixed GitCode-verified Mac files to exact existing release
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,concurrent.futures,hashlib,json,os,pathlib,subprocess,tempfile,time,urllib.parse
          REPO='NOTBAD314/2ByteASR';TAG='v0.9.3';RID=433563410;TARGET='7d4354c19df68525af62ff59b8805d0fe3d196b8'
          assert os.environ['GITHUB_REPOSITORY'].casefold()==REPO.casefold() and os.environ['INPUT_TAG']==TAG
          assert os.environ['GITHUB_ACTOR'].casefold()=='notbad314'
          data=json.loads(base64.b64decode(os.environ['ASSET_SPEC_B64']));spec=data['mac'];expected={x['name']:x for x in spec};old={x['name']:x for x in data['windows']}
          assert len(old)==16 and not(set(old)&set(expected))
          def gh(*args):return subprocess.check_output(['gh',*args],text=True)
          def release():
           r=json.loads(gh('api',f'repos/{REPO}/releases/{RID}'))
           assert not r['draft'] and r['tag_name']==TAG and r['target_commitish']==TARGET
           for x in r['assets']:
            if x['name'] in old:
             b=old[x['name']];assert x['id']==b['id'] and x['size']==b['size'] and x['digest']==b['digest'] and x['state']=='uploaded'
           assert set(old)<={x['name']for x in r['assets']}
           return r
          remote={x['name']:x for x in release()['assets']}
          for name,x in expected.items():
           assert pathlib.PurePosixPath(name).name==name and name not in old
           if name in remote:
            r=remote[name];assert r['state']=='uploaded' and r['size']==x['size'] and r['digest']=='sha256:'+x['sha256']
          folder=pathlib.Path(tempfile.mkdtemp(prefix='verified-mac093-append-'))
          def copy(x):
           name=x['name']
           if name in remote:return dict(name=name,reused=True)
           p=folder/name;url='https://gitcode.com/Notbad314/2ByteASR/releases/download/'+TAG+'/'+urllib.parse.quote(name)
           start=time.monotonic();print('DOWNLOAD',name,flush=True)
           subprocess.run(['curl','--fail','--location','--silent','--show-error','--retry','3','--connect-timeout','20','--max-time','900','--output',str(p),url],check=True)
           h=hashlib.sha256()
           with p.open('rb')as f:
            for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
           assert p.stat().st_size==x['size'] and h.hexdigest()==x['sha256'],name
           print('VERIFIED',name,flush=True)
           subprocess.run(['gh','release','upload',TAG,str(p),'--repo',REPO],check=True)
           return dict(name=name,seconds=round(time.monotonic()-start,2))
          with concurrent.futures.ThreadPoolExecutor(max_workers=3)as pool:results=list(pool.map(copy,spec))
          final={x['name']:x for x in release()['assets']}
          assert all(name in final and final[name]['state']=='uploaded' and final[name]['size']==x['size'] and final[name]['digest']=='sha256:'+x['sha256']for name,x in expected.items())
          print(json.dumps(dict(passed=True,release=RID,appended=len(expected),windows_preserved=len(old),results=results)),flush=True)
          PY
