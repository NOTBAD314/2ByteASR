name: verify-public-release

# Releases are built, signed and uploaded as drafts on the controlled build
# machine (scripts/release_pipeline.py); the signing key never reaches CI.
# This manual workflow only checks, without any credentials, that a published
# release and every asset its signed update manifest references can be
# downloaded anonymously. It never creates, edits or deletes a release, and it
# is not triggered by pushing or creating tags.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag, for example v0.6.5"
        required: true

permissions: {}

jobs:
  anonymous-download-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check assets without authentication
        env:
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/${REPOSITORY}/releases/download/${TAG}"
          curl -fsSL "${base}/SHA256SUMS.txt" -o SHA256SUMS.txt
          curl -fsSL "${base}/2ByteASR-update.json" -o 2ByteASR-update.json
          curl -fsSL "${base}/2ByteASR-update.json.sig" -o 2ByteASR-update.json.sig
          sha256sum --check --ignore-missing SHA256SUMS.txt
          while read -r digest name; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-0 "${base}/${name}")
            echo "${code} ${name}"
            test "${code}" = "206" -o "${code}" = "200"
          done < SHA256SUMS.txt
          python3 - <<'PY'
          import json, urllib.request
          manifest = json.load(open("2ByteASR-update.json", encoding="utf-8"))
          urls = [manifest["setup"]["urls"][0]] + [c["archive"]["urls"][0] for c in manifest["components"].values() if c.get("archive")]
          for url in urls:
              request = urllib.request.Request(url, method="HEAD")
              with urllib.request.urlopen(request) as response:
                  print(response.status, url)
          PY
