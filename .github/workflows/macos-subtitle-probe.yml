name: bounded-1.0.0-existing-DMG-worker-probe
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe-existing-dmg:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10.11'
          architecture: arm64
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: macos-arm64-setup-8a56eaa1145b8983a00999fdd15be7e0b8b81446
          run-id: 43185611553
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tmp/probe-input
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: macos-arm64-receipts-8a56eaa1145b8983a00999fdd15be7e0b8b81446
          run-id: 43185611553
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tmp/probe-receipts
      - name: Prepare isolated checker and inspect unchanged candidate
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/tmp/probe-runtime"
          "$RUNNER_TEMP/tmp/probe-runtime/bin/python" -m pip install --only-binary=:all: -r packaging/macos/requirements-main.txt
          "$RUNNER_TEMP/tmp/probe-runtime/bin/python" scripts/macos_subtitle_worker_probe.py --inputs "$RUNNER_TEMP/tmp/probe-input" --receipts "$RUNNER_TEMP/tmp/probe-receipts" --output "$RUNNER_TEMP/tmp/subtitle-worker-probe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: subtitle-worker-probe-${{ github.run_id }}
          retention-days: 1
          path: ${{ runner.temp }}/tmp/subtitle-worker-probe/
