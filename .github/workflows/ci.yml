name: 2byteasr-ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install lightweight test deps
        run: |
          python -m pip install -U pip
          python -m pip install pytest==9.1.1 pypinyin==0.55.0 requests==2.33.0 jieba==0.42.1 numpy==2.2.6 PySide6==6.9.2 QtAwesome==1.4.0 cryptography==50.0.2
      - name: Py compile
        run: |
          python -m py_compile auto_asr.py moss_firered_pipeline.py subtitle_core.py moss_worker.py firered_llm_worker.py register_host_voiceprint.py twobyteasr/service.py
          python -m compileall -q twobyteasr
      - name: Unit tests (no GPU)
        run: |
          $env:PYTHONUTF8 = "1"
          $env:DASHSCOPE_API_KEY = "sk-ci-dummy"
          python -m pytest -q tests
      - name: Release hygiene (offline)
        run: |
          $env:PYTHONUTF8 = "1"
          python scripts/check_release_hygiene.py
