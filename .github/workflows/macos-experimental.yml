name: 1.1.3 unchanged DMG native recheck
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recheck:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      RELEASE113_PRODUCT: 566969bf95d60440c3c73c485a55080eeb5b2e30
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10.11'
          architecture: arm64
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: 44688949082
          name: macos-arm64-setup-566969bf95d60440c3c73c485a55080eeb5b2e30
          path: ${{ runner.temp }}/tmp/installed-input
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: 44688949082
          name: macos-arm64-receipts-566969bf95d60440c3c73c485a55080eeb5b2e30
          path: ${{ runner.temp }}/tmp/producer-receipts
      - name: Prepare native checker
        run: |
          python -m venv "$RUNNER_TEMP/tmp/checker"
          "$RUNNER_TEMP/tmp/checker/bin/python" -m pip install -r packaging/macos/requirements-gui.txt
      - name: Repeat native acceptance with the same installer SHA
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find "$RUNNER_TEMP/tmp/installed-input" -name '*.dmg' -type f)
          command=("$RUNNER_TEMP/tmp/checker/bin/python" tests/release113_mac_recheck.py --dmg "$dmg" --receipt "$RUNNER_TEMP/tmp/producer-receipts/dmg/dmg-result.json" --output "$RUNNER_TEMP/tmp/recheck")
          if [[ '${{ matrix.os }}' == macos-26 ]]; then command+=(--full); fi
          python scripts/macos_display_mode_probe.py "$RUNNER_TEMP/tmp/display" "${command[@]}"
      - name: Keep scoped validation receipts
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'tmp/recheck'
          output = Path(os.environ['RUNNER_TEMP'])/'tmp/outcome'
          output.mkdir()
          owned = {'result.json', 'caption-policy-summary.json', 'caret-split-summary.json',
                   'newer-system-result.json', 'recheck-result.json', 'fixture-identity.json',
                   'bootstrap-neutral.json', 'column-settle.jsonl', 'verification.log',
                   'startup-project-result.json', 'export-validation.json', 'workshop-result.json',
                   'edit-save-summary.json', 'blank-project-summary.json', 'restart-summary.json',
                   'caret-more-menu.png', 'failure.png'}
          selected = 0
          for path in sorted(root.rglob('*')):
              rel = path.relative_to(root)
              if len(rel.parts) > 3 or any(part in {'installed','mounted','local','models','runtimes','profile'} for part in rel.parts):
                  continue
              if not path.is_file() or path.is_symlink() or (path.name not in owned and not path.name.endswith('-stdout.log')):
                  continue
              selected += path.stat().st_size
              if selected > 110*1024*1024:
                  raise RuntimeError('Scoped validation receipts exceeded their allowance')
              to = output/rel
              to.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(path,to)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: 113-exact-dmg-recheck-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/tmp/outcome
          retention-days: 1
          if-no-files-found: warn
