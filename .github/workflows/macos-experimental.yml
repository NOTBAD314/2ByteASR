name: Recheck the exact Apple Silicon 1.2.0 DMG

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  installed-app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PRODUCT_SOURCE_SHA: dee83d5549434ac51538d636d7628c8cc22870a9
      PRODUCT_DMG_SHA: a37e8fb9b0fd8e3042331d97f41d511f013dd57b524542dad49748d62b406cac
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10.11'
          architecture: arm64
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: 46107897149
          name: macos-arm64-setup-dee83d5549434ac51538d636d7628c8cc22870a9
          path: ${{ runner.temp }}/tmp/installer
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: 46107897149
          name: macos-arm64-receipts-dee83d5549434ac51538d636d7628c8cc22870a9
          path: ${{ runner.temp }}/tmp/producer
      - name: Prepare the isolated checker runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m venv "$RUNNER_TEMP/tmp/checker-runtime"
          "$RUNNER_TEMP/tmp/checker-runtime/bin/python" -m pip install -r packaging/macos/requirements-gui.txt
      - name: Verify installation, editing, recognition and export of the same DMG
        run: |
          set -euo pipefail
          dmg=$(find "$RUNNER_TEMP/tmp/installer" -name '*.dmg' -type f)
          [[ "$(shasum -a 256 "$dmg" | awk '{print $1}')" == "$PRODUCT_DMG_SHA" ]]
          python scripts/macos_display_mode_probe.py "$RUNNER_TEMP/tmp/display-120" \
            "$RUNNER_TEMP/tmp/checker-runtime/bin/python" scripts/macos_verify_candidate.py \
            --dmg "$dmg" --receipt "$RUNNER_TEMP/tmp/producer/dmg/dmg-result.json" \
            --source-sha "$PRODUCT_SOURCE_SHA" --output "$RUNNER_TEMP/tmp/recheck-120"
      - name: Match the installed bundle to the producer inventory
        if: always()
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tmp/checker-runtime/bin/python" - <<'PY'
          import json, os
          from pathlib import Path
          import subprocess
          from scripts.macos_package_dmg import inventory, sha256
          scope = Path(os.environ["RUNNER_TEMP"]) / "tmp"
          expected_path = scope / "producer/dmg/dmg-bundle-inventory.json"
          dmgreceipt = json.loads((scope / "producer/dmg/dmg-result.json").read_text("utf8"))
          assert sha256(expected_path) == dmgreceipt["bundle_inventory"]["sha256"]
          app = Path("/Applications/2ByteASR.app")
          subprocess.run(["/usr/bin/codesign", "--verify", "--deep", "--strict", str(app)], check=True)
          expected = json.loads(expected_path.read_text("utf8"))
          assert inventory(app) == expected
          result = dict(passed=True, product_source=os.environ["PRODUCT_SOURCE_SHA"],
                        checker_source=os.environ["GITHUB_SHA"], dmg_sha256=os.environ["PRODUCT_DMG_SHA"],
                        product_files=len(expected))
          (scope / "recheck-120/build/recheck-identity.json").write_text(json.dumps(result, indent=2), "utf8")
          PY
      - name: Select bounded acceptance receipts
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/tmp/recheck-120"; then
            python scripts/macos_collect_artifacts.py --qa-root "$RUNNER_TEMP/tmp/recheck-120" --maximum-bytes 100663296
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: macos120-exact-recheck-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/tmp/recheck-120/artifacts/receipts/
          retention-days: 1
          if-no-files-found: warn
