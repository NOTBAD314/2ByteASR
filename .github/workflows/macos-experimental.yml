name: Diagnose existing DMG project entry
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect-entry:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10.11'
          architecture: arm64
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: macos-arm64-setup-bcd71e4842b910af218e49b22187bb16664a71f9
          run-id: 42352625880
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tmp/diagnostic-input
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: macos-arm64-receipts-bcd71e4842b910af218e49b22187bb16664a71f9
          run-id: 42352625880
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tmp/diagnostic-receipts
      - name: Collect unchanged-app readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/tmp/checker-runtime"
          "$RUNNER_TEMP/tmp/checker-runtime/bin/python" -m pip install --only-binary=:all: PySide6==6.9.2
          dmg=$(find "$RUNNER_TEMP/tmp/diagnostic-input" -name '*.dmg' -type f)
          "$RUNNER_TEMP/tmp/checker-runtime/bin/python" scripts/macos_edit_save_diagnose.py --dmg "$dmg" --receipt "$RUNNER_TEMP/tmp/diagnostic-receipts/dmg/dmg-result.json" --output "$RUNNER_TEMP/tmp/r5-entry-diagnostic"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: macos-r5-entry-diagnostics
          retention-days: 1
          if-no-files-found: warn
          path: ${{ runner.temp }}/tmp/r5-entry-diagnostic/receipts/
