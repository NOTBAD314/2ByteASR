name: macOS arm64 experimental

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact trusted 40-character source commit in this repository'
        required: true
        type: string
      run_model_smoke:
        description: 'GUI prepare one locked SenseVoice CPU model, then real Chinese Home/Studio flow (no LLM)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-arm64-experimental-${{ github.repository }}
  cancel-in-progress: false

jobs:
  native-arm64:
    # Official standard runner: macOS 15 / Apple Silicon arm64. Rechecked
    # 2026-10-01. Dispatch only after actual included quota and $0 hard-stop
    # budget have been verified. No larger runner, cache or automatic retry.
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Validate fixed source input
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'An exact trusted commit SHA is required'; exit 2; }
          test "$(uname -m)" = arm64
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, official ref checked 2026-10-01
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkout identity and establish disposable boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          qa="$RUNNER_TEMP/tmp/2byteasr-macos-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$qa"
          printf 'MAC_QA_ROOT=%s\n' "$qa" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, official ref checked 2026-10-01
        with:
          python-version: '3.10.11'
          architecture: arm64
      - name: Prepare isolated native CPU runtime and build dependencies
        run: |
          set -euo pipefail
          python scripts/macos_prepare_runtime.py --runtime "$MAC_QA_ROOT/runtime" --receipt "$MAC_QA_ROOT/runtime.json"
          printf 'TWOBYTEASR_MAIN_PYTHON=%s\n' "$MAC_QA_ROOT/runtime/bin/python" >> "$GITHUB_ENV"
          printf 'TWOBYTEASR_TEST_ROOT=%s\n' "$MAC_QA_ROOT" >> "$GITHUB_ENV"
      - name: Install native media (lock drift fails in builder)
        run: |
          set -euo pipefail
          brew install ffmpeg mpv
          brew list --versions > "$MAC_QA_ROOT/brew-installed.txt"
      - name: Imports, native capabilities and platform regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          "$MAC_QA_ROOT/runtime/bin/python" scripts/macos_doctor.py --require-host --probe-torch --output "$MAC_QA_ROOT/doctor.json"
          "$MAC_QA_ROOT/runtime/bin/python" -m pytest -q tests/test_macos_platform.py tests/test_macos_build_contract.py tests/test_macos_gui_prepare.py tests/test_macos_delivery_boundary.py tests/test_studio_qt_preview.py --basetemp "$MAC_QA_ROOT/pytest" --junitxml "$MAC_QA_ROOT/tests.xml"
      - name: Fresh native .app and packaged normal-entry startup smoke
        run: |
          set -euo pipefail
          "$MAC_QA_ROOT/runtime/bin/python" scripts/macos_build.py --source-sha "$SOURCE_SHA" --output "$MAC_QA_ROOT/build" --runtime "$MAC_QA_ROOT/runtime"
      - name: Packaged native mpv socket/media smoke
        run: |
          set -euo pipefail
          "$MAC_QA_ROOT/build/dist/2ByteASR.app/Contents/MacOS/2ByteASR" --macos-media-smoke "$MAC_QA_ROOT/native-media-smoke"
      - name: Native embedded preview contract
        run: |
          set -euo pipefail
          if test -f scripts/verify_macos_embedded_preview.py; then
            "$MAC_QA_ROOT/runtime/bin/python" scripts/verify_macos_embedded_preview.py --output "$MAC_QA_ROOT/embedded-preview"
          fi
      - name: Actual native video hardware probe with no software fallback
        run: |
          set -euo pipefail
          "$MAC_QA_ROOT/runtime/bin/python" scripts/macos_hardware_probe.py --ffmpeg "$(command -v ffmpeg)" --output "$MAC_QA_ROOT/hardware-probe"
      - name: Optional actual GUI model preparation and Chinese Home to Studio
        if: ${{ inputs.run_model_smoke }}
        run: |
          set -euo pipefail
          "$MAC_QA_ROOT/runtime/bin/python" scripts/macos_desktop_smoke.py --app "$MAC_QA_ROOT/build/dist/2ByteASR.app" --runtime "$MAC_QA_ROOT/runtime" --fresh-runtime --audio ci-fixtures/original-chinese-qa.wav --output "$MAC_QA_ROOT/desktop-flow"
      - name: Bound artifact storage before upload
        if: always()
        run: |
          set -euo pipefail
          test -n "${MAC_QA_ROOT:-}" || exit 0
          python scripts/macos_collect_artifacts.py --qa-root "$MAC_QA_ROOT" --maximum-bytes 4294967296
      - name: Retain experimental artifacts and exact receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, official ref checked 2026-10-01
        with:
          name: macos-arm64-experimental-${{ inputs.source_sha }}
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0
          path: ${{ env.MAC_QA_ROOT }}/artifacts/
