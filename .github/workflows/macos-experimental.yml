name: Verify Mac isolated model compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: macos-26
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10.11'
          architecture: arm64
      - name: Check the isolated MPS probe and platform update routing
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tmp/compatibility-results"
          mkdir -p "$out"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m venv "$RUNNER_TEMP/tmp/compatibility-python"
          p="$RUNNER_TEMP/tmp/compatibility-python/bin/python"
          "$p" -m pip install -r packaging/macos/requirements-gui.txt
          "$p" -B -m pytest -q tests/test_macos_compatibility.py --basetemp "$RUNNER_TEMP/tmp/pytest-compatibility" --junitxml="$out/compatibility.xml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: macos120-compatibility-${{ github.sha }}
          path: ${{ runner.temp }}/tmp/compatibility-results/
          retention-days: 1
          if-no-files-found: error
