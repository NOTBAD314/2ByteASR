name: qualify-unchanged-1.0.0-DMG-on-two-systems
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  same-dmg:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10.11'
          architecture: arm64
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: macos-arm64-setup-1a1c07097f3ad1788a0b07a8f1e52107c32e87df
          run-id: 43209827566
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tmp/qualification-input
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: macos-arm64-receipts-1a1c07097f3ad1788a0b07a8f1e52107c32e87df
          run-id: 43209827566
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tmp/qualification-receipts
      - name: Prepare checker and prove native socket path boundary
        shell: bash
        run: |
          test '${{ inputs.source_sha }}' = '1a1c07097f3ad1788a0b07a8f1e52107c32e87df'
          python -m venv "$RUNNER_TEMP/tmp/qualification-runtime"
          "$RUNNER_TEMP/tmp/qualification-runtime/bin/python" -m pip install --only-binary=:all: PySide6==6.9.2
          "$RUNNER_TEMP/tmp/qualification-runtime/bin/python" scripts/macos_socket_path_probe.py "$RUNNER_TEMP/tmp/socket-proof"
      - name: Full unchanged installed candidate with bounded temporary paths
        shell: bash
        run: |
          dmg=$(find "$RUNNER_TEMP/tmp/qualification-input" -name '*.dmg' -type f)
          python scripts/macos_display_mode_probe.py "$RUNNER_TEMP/tmp/display-proof" "$RUNNER_TEMP/tmp/qualification-runtime/bin/python" scripts/macos_verify_candidate.py --dmg "$dmg" --receipt "$RUNNER_TEMP/tmp/qualification-receipts/dmg/dmg-result.json" --source-sha '1a1c07097f3ad1788a0b07a8f1e52107c32e87df' --output "$RUNNER_TEMP/tmp/q"
      - name: Select bounded qualification receipts
        if: always()
        shell: bash
        run: |
          if test -d "$RUNNER_TEMP/tmp/q"; then
            python scripts/macos_collect_artifacts.py --qa-root "$RUNNER_TEMP/tmp/q" --maximum-bytes 67108864
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: macos-final-qualification-r3-${{ matrix.os }}
          retention-days: 1
          path: |
            ${{ runner.temp }}/tmp/q/artifacts/receipts/
            ${{ runner.temp }}/tmp/socket-proof/*.json
            ${{ runner.temp }}/tmp/display-proof/*.json
