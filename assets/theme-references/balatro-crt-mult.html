<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Balatro CRT Mult · 2ByteASR 字幕特效档案</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  .wt-frame { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .wt-scope { position: absolute; inset: 0;
    --wt-font: "Cubic 11", "Cascadia Mono", "Microsoft YaHei UI", monospace;
    --wt-size: 58px; --wt-weight: 700; --wt-slant: normal; --wt-color: #ffffff;
    --wt-stroke: #080d12; --wt-stroke-w: 3.6px; --wt-stroke2: #000000; --wt-stroke2-w: 0.0px;
    --wt-spacing: 1.5px; --wt-u: 12px; --wt-dur: 2.400s; --wt-t: 0s; --wt-at: 3; --wt-p: 0;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 10vh; box-sizing: border-box;
  }
  .wt-stage { position: absolute; inset: 0; }
  .wt-cue { position: relative; }
.stage-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 1;
}
.stage-vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 50%, transparent 62%, rgba(5, 8, 12, 0.45) 100%);
}
.stage-scanline {
  position: absolute;
  inset: 0;
  opacity: 0.18;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(0, 0, 0, 0.4) 3px,
    rgba(0, 0, 0, 0.4) 6px
  );
  animation: wt-crt-flicker 0.12s infinite steps(2);
}
.crt-aberration {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 90%, rgba(0, 225, 217, 0.04), transparent 50%);
  animation: wt-ambient-pulse 4s ease-in-out infinite alternate;
}
@keyframes wt-crt-flicker {
  0% { opacity: 0.16; transform: translateY(0); }
  50% { opacity: 0.22; transform: translateY(1px); }
  100% { opacity: 0.16; transform: translateY(0); }
}
@keyframes wt-ambient-pulse {
  0% { opacity: 0.4; }
  100% { opacity: 0.9; }
}
.cue-container {
  position: absolute;
  left: 5%;
  right: 5%;
  bottom: calc(6 * var(--wt-u));
  height: calc(15 * var(--wt-u));
  display: flex;
  justify-content: center;
  align-items: flex-end;
  pointer-events: none;
}

.card-slider {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: center bottom;
  animation:
    wt-card-slam 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
    wt-card-retrieve 0.38s cubic-bezier(0.6, -0.28, 0.735, 0.045) calc(var(--wt-dur) - 0.38s) forwards;
}

.balatro-plate {
  position: relative;
  min-width: calc(48 * var(--wt-u));
  max-width: calc(110 * var(--wt-u));
  padding: calc(1.8 * var(--wt-u)) calc(5.5 * var(--wt-u));
  border-radius: calc(1.5 * var(--wt-u));
  background:
    repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.3) 0px,
      rgba(0, 0, 0, 0.3) 2px,
      transparent 2px,
      transparent 4px
    ),
    radial-gradient(
      ellipse at 50% 0%,
      #2f3c4c 0%,
      #1b232e 55%,
      #0e141c 100%
    );
  border: calc(0.35 * var(--wt-u)) solid #3d4f66;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.25),
    inset 0 -2px 0 rgba(0, 0, 0, 0.9),
    inset 0 0 calc(2.5 * var(--wt-u)) rgba(0, 0, 0, 0.65),
    0 calc(1 * var(--wt-u)) calc(3.5 * var(--wt-u)) rgba(0, 0, 0, 0.85),
    0 0 calc(1.8 * var(--wt-u)) rgba(0, 225, 217, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.plate-bezel {
  position: absolute;
  inset: calc(0.3 * var(--wt-u));
  border-radius: calc(1.2 * var(--wt-u));
  border: 1px dashed rgba(255, 215, 0, 0.35);
  pointer-events: none;
}

.foil-shimmer {
  position: absolute;
  inset: -100%;
  background: linear-gradient(
    115deg,
    transparent 40%,
    rgba(0, 225, 217, 0.18) 46%,
    rgba(254, 95, 85, 0.18) 50%,
    rgba(255, 215, 0, 0.25) 54%,
    transparent 60%
  );
  transform: translateX(-100%);
  animation: wt-foil-sweep 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  mix-blend-mode: screen;
  pointer-events: none;
}

.chips-stack {
  position: absolute;
  left: calc(-3.8 * var(--wt-u));
  bottom: calc(0.8 * var(--wt-u));
  display: flex;
  flex-direction: column-reverse;
  gap: calc(0.3 * var(--wt-u));
  z-index: 4;
  animation: wt-chips-float 2.8s ease-in-out infinite alternate;
}

.chip {
  width: calc(4.8 * var(--wt-u));
  height: calc(1.3 * var(--wt-u));
  border-radius: calc(0.65 * var(--wt-u));
  border: calc(0.2 * var(--wt-u)) dashed #ffffff;
  box-shadow: 0 calc(0.4 * var(--wt-u)) calc(0.8 * var(--wt-u)) rgba(0, 0, 0, 0.7);
}

.chip-blue {
  background: linear-gradient(180deg, #33f0e8 0%, #00a8a0 100%);
  border-color: rgba(255, 255, 255, 0.85);
}

.chip-red {
  background: linear-gradient(180deg, #ff857d 0%, #d83126 100%);
  border-color: rgba(255, 255, 255, 0.85);
  transform: rotate(-3deg);
}

.chip-gold {
  background: linear-gradient(180deg, #ffe066 0%, #d49f00 100%);
  border-color: rgba(255, 255, 255, 0.95);
  transform: rotate(2deg);
}

.joker-bell {
  position: absolute;
  top: calc(-0.4 * var(--wt-u));
  right: calc(1.2 * var(--wt-u));
  width: calc(3.4 * var(--wt-u));
  height: calc(3.4 * var(--wt-u));
  transform-origin: top center;
  animation: wt-bell-tinkling 1.6s ease-in-out infinite alternate;
  z-index: 5;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7));
}

.bell-svg {
  width: 100%;
  height: 100%;
}

.mult-flame {
  position: absolute;
  left: calc(1.2 * var(--wt-u));
  top: 50%;
  transform: translateY(-50%);
  width: calc(7 * var(--wt-u));
  height: calc(4 * var(--wt-u));
  border-radius: calc(0.8 * var(--wt-u));
  background: linear-gradient(180deg, #2b1114 0%, #150608 100%);
  border: calc(0.2 * var(--wt-u)) solid #fe5f55;
  box-shadow: 0 0 calc(1.2 * var(--wt-u)) rgba(254, 95, 85, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  z-index: 4;
}

.mult-tag {
  font-family: var(--wt-font);
  font-size: calc(1.5 * var(--wt-u));
  font-weight: 900;
  color: #ffffff;
  letter-spacing: 0.5px;
  text-shadow: 0 0 5px #fe5f55, 0 1px 2px #000;
  z-index: 2;
}

.flame-core {
  position: absolute;
  bottom: calc(-1 * var(--wt-u));
  width: 140%;
  height: 130%;
  background: radial-gradient(circle at 50% 90%, #ffe066 10%, #fe5f55 50%, transparent 80%);
  opacity: 0.75;
  animation: wt-flame-flicker 0.4s steps(3) infinite alternate;
}

.flame-spark {
  position: absolute;
  top: 10%;
  right: 20%;
  width: calc(0.6 * var(--wt-u));
  height: calc(0.6 * var(--wt-u));
  background: #ffffff;
  border-radius: 50%;
  box-shadow: 0 0 calc(0.8 * var(--wt-u)) #ffd700;
  animation: wt-spark-pop 0.8s ease-in-out infinite alternate;
}

.line {
  position: relative;
  display: inline-flex;
  flex-wrap: nowrap;
  align-items: center;
  white-space: nowrap;
  margin-left: calc(6.5 * var(--wt-u));
  margin-right: calc(1.5 * var(--wt-u));
  z-index: 3;
}

.line .wt-w {
  display: inline-block;
  font-family: var(--wt-font);
  font-size: var(--wt-size);
  font-weight: 900;
  color: #ffffff;
  letter-spacing: 2px;
  line-height: 1.1;
  text-shadow:
    -2.5px -2.5px 0 #090e14,
     2.5px -2.5px 0 #090e14,
    -2.5px  2.5px 0 #090e14,
     2.5px  2.5px 0 #090e14,
     0px 4px 6px rgba(0, 0, 0, 0.9),
     0px 0px 8px rgba(0, 225, 217, 0.35);
  opacity: 0;
  transform: translateY(calc(3 * var(--wt-u))) scale(0.65) rotate(-6deg);
  animation: wt-word-pop 0.32s cubic-bezier(0.175, 0.885, 0.32, 1.35) forwards;
}

.line .wt-w:nth-child(1) { animation-delay: 0.08s; }
.line .wt-w:nth-child(2) { animation-delay: 0.12s; }
.line .wt-w:nth-child(3) { animation-delay: 0.16s; }
.line .wt-w:nth-child(4) { animation-delay: 0.20s; }
.line .wt-w:nth-child(5) { animation-delay: 0.24s; }
.line .wt-w:nth-child(6) { animation-delay: 0.28s; }
.line .wt-w:nth-child(7) { animation-delay: 0.32s; }
.line .wt-w:nth-child(8) { animation-delay: 0.36s; }
.line .wt-w:nth-child(9) { animation-delay: 0.40s; }
.line .wt-w:nth-child(10) { animation-delay: 0.44s; }
.line .wt-w:nth-child(n+11) { animation-delay: 0.48s; }

@keyframes wt-card-slam {
  0% {
    opacity: 0;
    transform: translateY(calc(16 * var(--wt-u))) scale(0.7) rotate(7deg);
  }
  70% {
    opacity: 1;
    transform: translateY(calc(-0.8 * var(--wt-u))) scale(1.03) rotate(-1deg);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1) rotate(0deg);
  }
}

@keyframes wt-card-retrieve {
  0% {
    opacity: 1;
    transform: translateY(0) scale(1) rotate(0deg);
  }
  30% {
    transform: translateY(calc(-1.2 * var(--wt-u))) scale(1.04);
  }
  100% {
    opacity: 0;
    transform: translateY(calc(18 * var(--wt-u))) scale(0.65) rotate(-9deg);
  }
}

@keyframes wt-word-pop {
  0% {
    opacity: 0;
    transform: translateY(calc(3 * var(--wt-u))) scale(0.65) rotate(-6deg);
  }
  75% {
    opacity: 1;
    transform: translateY(calc(-0.4 * var(--wt-u))) scale(1.15) rotate(1.5deg);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1) rotate(0deg);
  }
}

@keyframes wt-foil-sweep {
  0% {
    transform: translateX(-120%) rotate(25deg);
  }
  35%, 100% {
    transform: translateX(180%) rotate(25deg);
  }
}

@keyframes wt-chips-float {
  0% {
    transform: translateY(0) rotate(0deg);
  }
  100% {
    transform: translateY(calc(-0.6 * var(--wt-u))) rotate(-2deg);
  }
}

@keyframes wt-bell-tinkling {
  0% {
    transform: rotate(-14deg);
  }
  100% {
    transform: rotate(14deg);
  }
}

@keyframes wt-flame-flicker {
  0% {
    transform: scale(0.92) skewX(-2deg);
    opacity: 0.65;
  }
  100% {
    transform: scale(1.08) skewX(2deg);
    opacity: 0.95;
  }
}

@keyframes wt-spark-pop {
  0% {
    transform: scale(0.6);
    opacity: 0.3;
  }
  100% {
    transform: scale(1.3);
    opacity: 1;
  }
}
</style>
</head>

<script>window.__2byteCueTemplate = "<div class=\"cue-container\">\n  <div class=\"chips-stack\">\n    <div class=\"chip chip-blue\"><\/div>\n    <div class=\"chip chip-red\"><\/div>\n    <div class=\"chip chip-gold\"><\/div>\n  <\/div>\n  <div class=\"card-slider\">\n    <div class=\"plate balatro-plate\">\n      <div class=\"plate-bezel\"><\/div>\n      <div class=\"foil-shimmer\"><\/div>\n      <div class=\"joker-bell\">\n        <svg class=\"bell-svg\">\n          <path d=\"M16 3 C10 3 6 8 6 14 C6 20 4 23 3 24 L29 24 C28 23 26 20 26 14 C26 8 22 3 16 3 Z\" fill=\"#ffd700\" stroke=\"#7a5500\" stroke-width=\"2\"/>\n          <circle cx=\"16\" cy=\"27\" r=\"3.5\" fill=\"#fe5f55\" stroke=\"#420d09\" stroke-width=\"1.5\"/>\n        <\/svg>\n      <\/div>\n      <div class=\"mult-flame\">\n        <div class=\"flame-core\"><\/div>\n        <div class=\"flame-spark\"><\/div>\n        <span class=\"mult-tag\">+MULT<\/span>\n      <\/div>\n      <div class=\"line\">\n        {{words}}\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>";</script>
<script>

window.__2byteSeek = async function (cueMs, stageMs) {
  // 二十一轮：ready 等待 60ms 封顶——Animation.ready 在动画被取消/替换时
  // 可能永不结算，整页 evaluate 挂死=播放冻成静止帧（用户实测重播十几次
  // 后卡死）。scrub 精度损失可忽略（后续帧会覆盖）。
  var capped = function (p) {
    return Promise.race([p, new Promise(function (res) { setTimeout(res, 60); })]);
  };
  var stage = document.querySelector('.wt-stage');
  var cue = document.getElementById('wt-cue');
  async function scrub(root, tMs) {
    if (!root) return;
    var anims = root.getAnimations({subtree: true});
    for (var i = 0; i < anims.length; i++) { try { anims[i].pause(); } catch (e) {} }
    for (var j = 0; j < anims.length; j++) {
      try { await capped(anims[j].ready); } catch (e) {}
      try { anims[j].currentTime = tMs; } catch (e) {}
    }
  }
  await scrub(stage, stageMs);
  await scrub(cue, cueMs);
  // 二十四轮：与 TSX 运行时同款 token——部分主题用 var(--wt-t) 参与计算。
  try {
    var scope = document.querySelector('.wt-scope');
    if (scope) {
      var dRaw = getComputedStyle(scope).getPropertyValue('--wt-dur') || '0s';
      var durMs = (parseFloat(dRaw) || 0) * 1000;
      var progress = durMs > 0 ? Math.max(0, Math.min(1, cueMs / durMs)) : 0;
      var s = scope.style;
      s.setProperty('--wt-t', Math.max(0, cueMs) + 'ms');
      s.setProperty('--wt-at', Math.max(0, stageMs) + 'ms');
      s.setProperty('--wt-p', String(Math.round(progress * 1000) / 1000));
    }
  } catch (e) {}
};
// 二十轮引入自由播放；二十四轮修正 play() 语义：已完成的有限动画（入场/
// 出场这类一次性 keyframes）钉在末态，只有未完成/无限动画继续走。
window.__2bytePlay = async function (cueMs, stageMs, rate) {
  await window.__2byteSeek(cueMs, stageMs);
  var stage = document.querySelector('.wt-stage');
  var cue = document.getElementById('wt-cue');
  function play(root, r) {
    if (!root) return;
    var anims = root.getAnimations({subtree: true});
    for (var i = 0; i < anims.length; i++) {
      var a = anims[i];
      try {
        a.playbackRate = r;
        var end = Infinity;
        try {
          var timing = a.effect && a.effect.getComputedTiming();
          if (timing && Number.isFinite(timing.endTime)) end = timing.endTime;
        } catch (e) {}
        if (Number.isFinite(end) && end > 0 && (a.currentTime == null || a.currentTime >= end)) {
          a.currentTime = end;  // 钉末态：play() 会回卷 finished 动画重播
          a.pause();
        } else {
          a.play();
        }
      } catch (e) {}
    }
  }
  play(stage, rate);
  play(cue, rate);
};
// 二十二轮（换字快速路径）：同主题换文案不重载页面——用内嵌模板重建 cue 层
// DOM（Python 侧 substitute_placeholders 的 JS 镜像）；重建后由调用方重新
// __2bytePlay/__2byteSeek 同步动画（新 DOM = 新动画实例）。换页 1-2s vs 换字
// ~50ms——cue 切换不再丢入场首帧。
window.__2byteSetCue = function (text, speaker) {
  var cue = document.getElementById('wt-cue');
  var template = window.__2byteCueTemplate;
  if (!cue || typeof template !== 'string') return false;
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  var s = String(text == null ? '' : text);
  var escaped = esc(s).replace(/\n/g, '<br>');
  var words = '';
  for (var i = 0; i < s.length; i++) {
    var ch = s[i];
    words += /\s/.test(ch) ? ' ' : '<span class="wt-w">' + esc(ch) + '</span>';
  }
  var html = template
    .replace(/\{\{\s*text\s*\}\}/g, escaped)
    .replace(/\{\{\s*words\s*\}\}/g, words)
    .replace(/\{\{\s*speaker\s*\}\}/g, esc(String(speaker || '')))
    .replace(/\{\{\s*translation\s*\}\}/g, '');
  cue.innerHTML = html;
  return true;
};
